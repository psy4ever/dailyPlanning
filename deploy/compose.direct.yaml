services:
  api:
    environment:
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
  gateway:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      API_PUBLIC_HOST: ${API_PUBLIC_HOST:?Missing API_PUBLIC_HOST}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.direct:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
