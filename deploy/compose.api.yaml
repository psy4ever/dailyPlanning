services:
  api:
    image: daily-rhythm-api:0.3.2
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}
      DAILY_USERNAME: ${DAILY_USERNAME:?Missing DAILY_USERNAME}
      DAILY_PASSWORD: ${DAILY_PASSWORD:?Missing DAILY_PASSWORD}
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, java, -cp, /app/health, com.dayoudu.cloud.HealthProbe]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
